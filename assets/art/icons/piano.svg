<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-label="Illustration of a piano keyboard">
  <!-- Toucan Music palette: paper, petrol ink, canopy greens, beak-gold -->
  <rect width="1200" height="900" fill="#e2f0e7"/>
  <!-- lid, open -->
  <path d="M250 330 L870 150 Q900 142 900 172 L900 330 Z" fill="#1b3f2b"/>
  <path d="M250 330 L870 150 Q900 142 900 172 L900 330 Z" fill="#0b1f15" opacity="0.25"/>
  <!-- body -->
  <rect x="200" y="330" width="800" height="300" rx="14" fill="#204a32"/>
  <rect x="200" y="330" width="800" height="60" fill="#0b1f15" opacity="0.28"/>
  <!-- keybed -->
  <rect x="236" y="400" width="728" height="190" rx="6" fill="#f6faf6"/>
  <g stroke="#102a1d" stroke-opacity="0.18" stroke-width="3">
    <line x1="288" y1="400" x2="288" y2="590"/><line x1="340" y1="400" x2="340" y2="590"/>
    <line x1="392" y1="400" x2="392" y2="590"/><line x1="444" y1="400" x2="444" y2="590"/>
    <line x1="496" y1="400" x2="496" y2="590"/><line x1="548" y1="400" x2="548" y2="590"/>
    <line x1="600" y1="400" x2="600" y2="590"/><line x1="652" y1="400" x2="652" y2="590"/>
    <line x1="704" y1="400" x2="704" y2="590"/><line x1="756" y1="400" x2="756" y2="590"/>
    <line x1="808" y1="400" x2="808" y2="590"/><line x1="860" y1="400" x2="860" y2="590"/>
    <line x1="912" y1="400" x2="912" y2="590"/>
  </g>
  <g fill="#0b1f15">
    <rect x="272" y="400" width="32" height="118" rx="3"/><rect x="324" y="400" width="32" height="118" rx="3"/>
    <rect x="428" y="400" width="32" height="118" rx="3"/><rect x="480" y="400" width="32" height="118" rx="3"/><rect x="532" y="400" width="32" height="118" rx="3"/>
    <rect x="636" y="400" width="32" height="118" rx="3"/><rect x="688" y="400" width="32" height="118" rx="3"/>
    <rect x="792" y="400" width="32" height="118" rx="3"/><rect x="844" y="400" width="32" height="118" rx="3"/><rect x="896" y="400" width="32" height="118" rx="3"/>
  </g>
  <!-- legs -->
  <rect x="240" y="630" width="44" height="120" rx="8" fill="#1b3f2b"/>
  <rect x="916" y="630" width="44" height="120" rx="8" fill="#1b3f2b"/>
  <!-- a note rising from the lid -->
  <g fill="#f0c86f">
    <ellipse cx="1010" cy="250" rx="34" ry="24" transform="rotate(-20 1010 250)"/>
    <rect x="1036" y="120" width="12" height="134" rx="6"/>
    <path d="M1048 120 q60 20 40 90 q-10 -40 -40 -50 z"/>
  </g>
</svg>
