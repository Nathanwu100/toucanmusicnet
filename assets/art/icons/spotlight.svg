<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-label="Illustration of a stage under spotlights">
  <rect width="1200" height="900" fill="#102a1d"/>
  <!-- beams -->
  <path d="M300 0 L120 700 L560 700 Z" fill="#f0c86f" opacity="0.22"/>
  <path d="M900 0 L640 700 L1080 700 Z" fill="#f0c86f" opacity="0.22"/>
  <path d="M600 0 L420 700 L780 700 Z" fill="#f6faf6" opacity="0.16"/>
