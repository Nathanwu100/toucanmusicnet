  <g fill="#0b1f15">
    <rect x="260" y="0" width="80" height="50" rx="10"/><rect x="560" y="0" width="80" height="50" rx="10"/><rect x="860" y="0" width="80" height="50" rx="10"/>
  </g>
  <g fill="#f0c86f">
    <circle cx="300" cy="52" r="14"/><circle cx="600" cy="52" r="14"/><circle cx="900" cy="52" r="14"/>
