<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reset your password — Toucan Music</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://code.iconify.design" crossorigin />
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,700;12..96,800&family=Instrument+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet" />
  <script src="https://code.iconify.design/iconify-icon/3.0.0/iconify-icon.min.js" defer></script>
  <link rel="icon" type="image/png" href="assets/sprites/bird-logo.png" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js" defer></script>
  <script src="js/config.js?v=2" defer></script>
  <script src="js/phone.js?v=1" defer></script>
  <script src="js/api.js?v=19" defer></script>
  <script src="js/parallax.js?v=3" defer></script>
  <script src="js/tutorial.js" defer></script>
  <script src="js/background.js?v=4" defer></script>
  <script src="js/app.js?v=22" defer></script>
  <meta name="robots" content="noindex" />
  <link rel="stylesheet" href="css/style.css?v=47" />
</head>
<body>
  <nav class="nav" data-site-nav>
    <a class="brand" href="index.html"><span class="brand-bird" data-brand-bird aria-hidden="true"></span>Toucan Music</a>
    <div class="nav-links">
      <a class="nav-icon-link" href="index.html" aria-label="Home" data-tooltip="Home"><iconify-icon icon="pixelarticons:home" aria-hidden="true"></iconify-icon></a>
      <a class="nav-icon-link" href="about.html" aria-label="About us" data-tooltip="About us"><iconify-icon icon="pixelarticons:users" aria-hidden="true"></iconify-icon></a>
      <a class="nav-icon-link" href="calendar.html?v=3" aria-label="Calendar" data-tooltip="Calendar"><iconify-icon icon="pixelarticons:calendar" aria-hidden="true"></iconify-icon></a>
      <span class="nav-auth" data-nav-auth>
        <button class="nav-icon-button" type="button" data-open-settings aria-label="Settings" data-tooltip="Settings"><iconify-icon icon="pixelarticons:settings-cog" aria-hidden="true"></iconify-icon></button>
        <a class="nav-icon-link" href="login.html" aria-current="page" aria-label="Log in" data-tooltip="Log in"><iconify-icon icon="pixelarticons:login" aria-hidden="true"></iconify-icon></a>
        <a class="btn btn-primary btn-sm nav-join" href="signup.html"><iconify-icon icon="pixelarticons:user-plus" aria-hidden="true"></iconify-icon>Join us</a>
      </span>
    </div>
  </nav>

  <main class="auth-wrap">
    <div class="panel">
      <h1>Reset your password</h1>
      <p class="sub">Give us the email on the account and we will send a link to set a new password.</p>
      <div class="form-error" id="error" role="alert"></div>
      <div class="login-recovery" id="sent-note" hidden>
        <strong>Check your email</strong>
        <p id="sent-detail">If that address has an account, a reset link is on its way. The link is good for one hour.</p>
        <p class="login-recovery-status" id="demo-note"></p>
      </div>
      <form id="forgot-form" novalidate>
        <div class="field">
          <label for="email">Email</label>
          <input type="email" id="email" autocomplete="email" required />
        </div>
        <button class="btn btn-primary" type="submit" id="submit" style="width:100%">Send the reset link</button>
      </form>
      <p class="hint" style="margin-top:1.2rem">Remembered it? <a href="login.html">Log in</a>.</p>
    </div>
  </main>

  <footer data-site-footer></footer>

  <script type="module">
    const form = document.getElementById("forgot-form");
    const err = document.getElementById("error");
    const sent = document.getElementById("sent-note");
    const demoNote = document.getElementById("demo-note");
    const btn = document.getElementById("submit");

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      err.classList.remove("show");
      btn.disabled = true;
      btn.textContent = "Sending…";
      try {
        const result = await ToucanAPI.requestPasswordReset(document.getElementById("email").value);
        form.hidden = true;
        sent.hidden = false;
        // Demo mode has no mailbox, so it hands the link back directly.
        if (result.demoLink) {
          demoNote.innerHTML = "";
          demoNote.append(document.createTextNode("Demo mode, so no email was sent. "));
          const link = document.createElement("a");
          link.href = result.demoLink;
          link.textContent = "Open the reset link";
          demoNote.append(link, document.createTextNode("."));
        } else if (ToucanAPI.demoMode) {
          demoNote.textContent = "Demo mode: no account matches that address.";
        }
      } catch (ex) {
        err.textContent = ex.message;
        err.classList.add("show");
        btn.disabled = false;
        btn.textContent = "Send the reset link";
      }
    });
  </script>
</body>
</html>
