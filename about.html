<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>About us - Toucan Music</title>
  <meta name="description" content="The teachers, volunteers, and neighbors behind Toucan Music's free piano, violin, and viola classes." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,700;12..96,800&family=Instrument+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet" />
  <script src="js/icons.js?v=1" defer></script>
  <link rel="icon" type="image/png" href="assets/sprites/bird-logo.png" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js" defer></script>
  <script src="js/config.js?v=2" defer></script>
  <script src="js/phone.js?v=1" defer></script>
  <script src="js/api.js?v=20" defer></script>
  <script src="js/parallax.js?v=3" defer></script>
  <script src="js/tutorial.js?v=2" defer></script>
  <script src="js/background.js?v=4" defer></script>
  <script src="js/team.js?v=8" defer></script>
  <script src="js/gallery.js?v=2" defer></script>
  <script src="js/app.js?v=24" defer></script>
  <link rel="stylesheet" href="css/style.css?v=57" />
</head>
<body class="about-page">
  <nav class="nav" data-site-nav>
    <a class="brand" href="index.html"><span class="brand-bird" data-brand-bird aria-hidden="true"></span>Toucan Music</a>
    <div class="nav-links">
      <a class="nav-icon-link" href="index.html" aria-label="Home" data-tooltip="Home"><iconify-icon icon="pixelarticons:home" aria-hidden="true"></iconify-icon></a>
      <a class="nav-icon-link" href="about.html" aria-current="page" aria-label="About us" data-tooltip="About us"><iconify-icon icon="pixelarticons:users" aria-hidden="true"></iconify-icon></a>
      <a class="nav-icon-link" href="calendar.html?v=3" aria-label="Calendar" data-tooltip="Calendar"><iconify-icon icon="pixelarticons:calendar" aria-hidden="true"></iconify-icon></a>
      <span class="nav-auth" data-nav-auth>
        <button class="nav-icon-button" type="button" data-open-settings aria-label="Settings" data-tooltip="Settings"><iconify-icon icon="pixelarticons:settings-cog" aria-hidden="true"></iconify-icon></button>
        <a class="nav-icon-link" href="login.html" aria-label="Log in" data-tooltip="Log in"><iconify-icon icon="pixelarticons:login" aria-hidden="true"></iconify-icon></a>
        <a class="btn btn-primary btn-sm nav-join" href="signup.html"><iconify-icon icon="pixelarticons:user-plus" aria-hidden="true"></iconify-icon>Join us</a>
      </span>
    </div>
  </nav>

  <main class="team-page">
    <h1 class="team-page-title">About us</h1>
    <ul class="team-list" data-team-list></ul>

    <section class="gallery" aria-labelledby="gallery-title">
      <div class="gallery-head">
        <h2 id="gallery-title">Inside a lesson</h2>
        <p>Weekends in Palo Alto: first bow holds, note names on the whiteboard, a quartet warming up outside. Any photo opens full size.</p>
      </div>
      <ul class="gallery-strip" data-gallery aria-label="Photos from lessons"></ul>
      <div class="gallery-controls">
        <div class="gallery-progress" aria-hidden="true"><div class="gallery-progress-thumb" data-gallery-thumb></div></div>
        <span class="gallery-count" data-gallery-count aria-live="polite"></span>
        <div class="gallery-arrows">
          <button type="button" class="gallery-arrow" data-gallery-prev aria-label="Scroll to previous photos">
            <iconify-icon icon="pixelarticons:chevron-left" aria-hidden="true"></iconify-icon>
          </button>
          <button type="button" class="gallery-arrow" data-gallery-next aria-label="Scroll to next photos">
            <iconify-icon icon="pixelarticons:chevron-right" aria-hidden="true"></iconify-icon>
          </button>
        </div>
      </div>
    </section>
  </main>

  <dialog class="viewer" data-gallery-viewer aria-label="Photo viewer">
    <button type="button" class="viewer-close" data-viewer-close aria-label="Close">
      <iconify-icon icon="pixelarticons:close" aria-hidden="true"></iconify-icon>
    </button>
    <div class="viewer-stage" data-viewer-stage>
      <img data-viewer-image alt="" />
    </div>
    <div class="viewer-bar">
      <p class="viewer-caption" data-viewer-caption aria-live="polite"></p>
      <div class="viewer-nav">
        <span class="viewer-counter" data-viewer-counter></span>
        <button type="button" class="viewer-arrow" data-viewer-prev aria-label="Previous photo">
          <iconify-icon icon="pixelarticons:chevron-left" aria-hidden="true"></iconify-icon>
        </button>
        <button type="button" class="viewer-arrow" data-viewer-next aria-label="Next photo">
          <iconify-icon icon="pixelarticons:chevron-right" aria-hidden="true"></iconify-icon>
        </button>
      </div>
    </div>
  </dialog>

  <footer data-site-footer></footer>

</body>
</html>
