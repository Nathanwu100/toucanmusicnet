<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Choose a new password — Toucan Music</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,700;12..96,800&family=Instrument+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet" />
  <script src="js/icons.js?v=1" defer></script>
  <link rel="icon" type="image/png" href="assets/sprites/bird-logo.png" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js" defer></script>
  <script src="js/config.js?v=2" defer></script>
  <script src="js/phone.js?v=1" defer></script>
  <script src="js/api.js?v=19" defer></script>
  <script src="js/parallax.js?v=3" defer></script>
  <script src="js/tutorial.js?v=2" defer></script>
  <script src="js/background.js?v=4" defer></script>
  <script src="js/app.js?v=24" defer></script>
  <meta name="robots" content="noindex" />
  <link rel="stylesheet" href="css/style.css?v=53" />
</head>
<body>
  <nav class="nav" data-site-nav>
    <a class="brand" href="index.html"><span class="brand-bird" data-brand-bird aria-hidden="true"></span>Toucan Music</a>
    <div class="nav-links">
      <a class="nav-icon-link" href="index.html" aria-label="Home" data-tooltip="Home"><iconify-icon icon="pixelarticons:home" aria-hidden="true"></iconify-icon></a>
      <a class="nav-icon-link" href="about.html" aria-label="About us" data-tooltip="About us"><iconify-icon icon="pixelarticons:users" aria-hidden="true"></iconify-icon></a>
      <a class="nav-icon-link" href="calendar.html?v=3" aria-label="Calendar" data-tooltip="Calendar"><iconify-icon icon="pixelarticons:calendar" aria-hidden="true"></iconify-icon></a>
      <span class="nav-auth" data-nav-auth>
        <button class="nav-icon-button" type="button" data-open-settings aria-label="Settings" data-tooltip="Settings"><iconify-icon icon="pixelarticons:settings-cog" aria-hidden="true"></iconify-icon></button>
        <a class="nav-icon-link" href="login.html" aria-current="page" aria-label="Log in" data-tooltip="Log in"><iconify-icon icon="pixelarticons:login" aria-hidden="true"></iconify-icon></a>
        <a class="btn btn-primary btn-sm nav-join" href="signup.html"><iconify-icon icon="pixelarticons:user-plus" aria-hidden="true"></iconify-icon>Join us</a>
      </span>
    </div>
  </nav>

  <main class="auth-wrap">
    <div class="panel">
      <h1>Choose a new password</h1>
      <p class="sub" id="intro">Checking your reset link…</p>
      <div class="form-error" id="error" role="alert"></div>
      <form id="reset-form" novalidate hidden>
        <div class="field">
          <label for="password">New password</label>
          <input type="password" id="password" autocomplete="new-password" minlength="8" required />
          <p class="hint">At least 8 characters.</p>
        </div>
        <div class="field">
          <label for="confirm">Type it again</label>
          <input type="password" id="confirm" autocomplete="new-password" minlength="8" required />
        </div>
        <button class="btn btn-primary" type="submit" id="submit" style="width:100%">Save the new password</button>
      </form>
      <p class="hint" id="expired-help" hidden style="margin-top:1.2rem">
        <a href="forgot-password.html">Ask for a new link</a>, or <a href="login.html">go back to log in</a>.
      </p>
    </div>
  </main>

  <footer data-site-footer></footer>

  <script type="module" src="js/page-reset-password.js?v=1"></script>
</body>
</html>
