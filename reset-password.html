<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Choose a new password — Toucan Music</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://code.iconify.design" crossorigin />
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,700;12..96,800&family=Instrument+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet" />
  <script src="https://code.iconify.design/iconify-icon/3.0.0/iconify-icon.min.js" defer></script>
  <link rel="icon" type="image/png" href="assets/sprites/bird-logo.png" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js" defer></script>
  <script src="js/config.js?v=2" defer></script>
  <script src="js/phone.js?v=1" defer></script>
  <script src="js/api.js?v=17" defer></script>
  <script src="js/parallax.js?v=3" defer></script>
  <script src="js/tutorial.js" defer></script>
  <script src="js/background.js?v=4" defer></script>
  <script src="js/app.js?v=21" defer></script>
  <meta name="robots" content="noindex" />
  <link rel="stylesheet" href="css/style.css?v=41" />
</head>
<body>
  <nav class="nav" data-site-nav>
    <a class="brand" href="index.html"><span class="brand-bird" data-brand-bird aria-hidden="true"></span>Toucan Music</a>
    <div class="nav-links">
      <a class="nav-icon-link" href="index.html" aria-label="Home" data-tooltip="Home"><iconify-icon icon="pixelarticons:home" aria-hidden="true"></iconify-icon></a>
      <a class="nav-icon-link" href="about.html" aria-label="About us" data-tooltip="About us"><iconify-icon icon="pixelarticons:users" aria-hidden="true"></iconify-icon></a>
      <a class="nav-icon-link" href="calendar.html?v=3" aria-label="Calendar" data-tooltip="Calendar"><iconify-icon icon="pixelarticons:calendar" aria-hidden="true"></iconify-icon></a>
      <span class="nav-auth" data-nav-auth>
        <button class="nav-icon-button" type="button" data-open-settings aria-label="Settings" data-tooltip="Settings"><iconify-icon icon="pixelarticons:settings-cog" aria-hidden="true"></iconify-icon></button>
        <a class="nav-icon-link" href="login.html" aria-current="page" aria-label="Log in" data-tooltip="Log in"><iconify-icon icon="pixelarticons:login" aria-hidden="true"></iconify-icon></a>
        <a class="btn btn-primary btn-sm nav-join" href="signup.html"><iconify-icon icon="pixelarticons:user-plus" aria-hidden="true"></iconify-icon>Join us</a>
      </span>
    </div>
  </nav>

  <main class="auth-wrap">
    <div class="panel">
      <h1>Choose a new password</h1>
      <p class="sub" id="intro">Checking your reset link…</p>
      <div class="form-error" id="error" role="alert"></div>
      <form id="reset-form" novalidate hidden>
        <div class="field">
          <label for="password">New password</label>
          <input type="password" id="password" autocomplete="new-password" minlength="8" required />
          <p class="hint">At least 8 characters.</p>
        </div>
        <div class="field">
          <label for="confirm">Type it again</label>
          <input type="password" id="confirm" autocomplete="new-password" minlength="8" required />
        </div>
        <button class="btn btn-primary" type="submit" id="submit" style="width:100%">Save the new password</button>
      </form>
      <p class="hint" id="expired-help" hidden style="margin-top:1.2rem">
        <a href="forgot-password.html">Ask for a new link</a>, or <a href="login.html">go back to log in</a>.
      </p>
    </div>
  </main>

  <footer data-site-footer></footer>

  <script type="module">
    const form = document.getElementById("reset-form");
    const intro = document.getElementById("intro");
    const err = document.getElementById("error");
    const expiredHelp = document.getElementById("expired-help");
    const demoToken = new URLSearchParams(window.location.search).get("demo_token");

    function refuse(message) {
      intro.textContent = message;
      form.hidden = true;
      expiredHelp.hidden = false;
    }

    // Supabase puts the recovery token in the URL fragment and swaps it for a
    // session on load. Give that a moment before deciding the link is dead.
    async function ready() {
      if (ToucanAPI.demoMode) return ToucanAPI.hasValidRecovery(demoToken);
      for (let attempt = 0; attempt < 12; attempt += 1) {
        if (await ToucanAPI.hasValidRecovery()) return true;
        await new Promise((resolve) => setTimeout(resolve, 250));
      }
      return false;
    }

    if (await ready()) {
      intro.textContent = "Pick something you have not used here before.";
      form.hidden = false;
    } else {
      refuse("This reset link has expired or has already been used.");
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      err.classList.remove("show");
      const password = document.getElementById("password").value;
      const confirm = document.getElementById("confirm").value;
      if (password !== confirm) {
        err.textContent = "Those two passwords do not match.";
        err.classList.add("show");
        return;
      }
      const btn = document.getElementById("submit");
      btn.disabled = true;
      btn.textContent = "Saving…";
      try {
        await ToucanAPI.completePasswordReset(password, demoToken);
        window.location.href = "calendar.html?v=3";
      } catch (ex) {
        if (ex.code === "recovery_expired") {
          refuse(ex.message);
          return;
        }
        err.textContent = ex.message;
        err.classList.add("show");
        btn.disabled = false;
        btn.textContent = "Save the new password";
      }
    });
  </script>
</body>
</html>
